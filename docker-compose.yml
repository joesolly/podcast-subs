services:
  podcast-subs:
    image: ghcr.io/joesolly/podcast-subs:latest-cpu
    # Build locally instead (e.g. to bump WHISPER_MODEL or the stable-ts pin)
    # by commenting out `image:` above and uncommenting this:
    # build:
    #   context: .
    #   target: runtime-cpu
    #   args:
    #     WHISPER_MODEL: small
    #     STABLE_TS_FORK_URL: https://github.com/joesolly/stable-ts.git
    #     STABLE_TS_REF: frozen-2026-09-03   # pinned tag on the forked repo
    container_name: podcast-subs
    restart: unless-stopped
    environment:
      MODEL_SIZE: small
      OUTPUT_FORMATS: srt
      STABLE_CHECK_SECONDS: "30"
      DEVICE: cpu
      COMPUTE_TYPE: int8
      # LANGUAGE: en   # uncomment to force a language instead of auto-detect
    volumes:
      - /path/to/podcasts:/watch

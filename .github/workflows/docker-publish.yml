name: Build and publish Docker images

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 1.2.3). Defaults to short commit SHA."
        required: false
        type: string
      whisper_model:
        description: "faster-whisper model size to bake in"
        required: false
        type: string
        default: "small"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/podcast-subs

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="sha-$(echo ${GITHUB_SHA} | cut -c1-7)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

  build:
    needs: resolve-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, gpu]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.variant }})
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime-${{ matrix.variant }}
          push: true
          build-args: |
            WHISPER_MODEL=${{ inputs.whisper_model || 'small' }}
            STABLE_TS_FORK_URL=${{ vars.STABLE_TS_FORK_URL }}
            STABLE_TS_REF=${{ vars.STABLE_TS_REF }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.resolve-version.outputs.version }}-${{ matrix.variant }}
            ${{ env.IMAGE_NAME }}:latest-${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
